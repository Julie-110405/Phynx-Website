<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap">
<title>Pynx Procurement Dashboard</title>
<style>
:root{--bg:#efebe5;--ink:#111;--mut:#6b655d;--card:#fff;--line:#e8e3dc;--ok:#1f7a4d;--okb:#d8f0e2;--warn:#a8741a;--warnb:#fbecc8;--bad:#b3392f;--badb:#f8d9d5;--sb:#000;--acc:#111}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Quicksand,Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sb{background:var(--sb);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:block;margin:6px auto 18px;width:150px;max-width:70%;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#fff;text-decoration:none;font-size:15.5px;font-weight:500;cursor:pointer}
.nav a:hover{background:#1c1c1c}.nav a.on{background:#3a3a3a}.nav a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav-icon{width:20px;text-align:center}
.who{margin-top:auto;padding-top:14px;border-top:1px solid #2a2a2a;font-size:12px;color:#bbb}.who b{display:block;color:#fff;font-size:13px}
main{padding:30px 32px 50px;min-width:0}
h1{font-weight:400;font-size:34px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px}
h2{font-weight:600;font-size:17px;margin:0 0 12px}
.card{background:var(--card);border-radius:20px;padding:20px}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr;align-items:start}
.big{font-size:30px;font-weight:600;margin:6px 0 2px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.In,.Rel,.All{background:var(--okb);color:var(--ok)}.Low,.Pen,.Part{background:var(--warnb);color:var(--warn)}.Out{background:var(--badb);color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0;width:100%}
.tools input,.tools select{width:auto;flex:1 1 150px}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.sm{padding:6px 11px;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:12px;color:var(--mut);text-align:left;padding:10px 8px;font-weight:600}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}.r{text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border-radius:99px}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-weight:600;font-size:12.5px;margin:12px 0 5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{width:100%;max-width:460px;max-height:90vh;overflow:auto}
.rc{font-family:ui-monospace,Consolas,monospace;font-size:13px}.rc .row{padding:5px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:10}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:800px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;padding:12px 10px}.brand{text-align:center}.nav{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px}.nav a{padding:8px 12px;font-size:13px;background:#141414}.who{display:none}main{padding:20px 14px 40px}h1{font-size:25px}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
@media print{.sb,.tools,.tabs,.noprint{display:none!important}.app{display:block}main{padding:0}.modal{position:static;background:none}}
</style></head><body>
<div class="app">
<aside class="sb">
 <img class="logo" src="assets/images/pynx-logo-transparent.png" alt="Pynx - Beyond the Trend">
 <nav class="nav" id="nav"></nav>
 <div class="who"><b>Procurement Department</b>Purchasing Manager / Staff</div>
</aside>
<main id="main"></main>
</div>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso=n=>'₱'+Number(n).toLocaleString('en-PH');
const CLS={Pending:'Pen',Approved:'All',Ordered:'Part',Sent:'Part',Confirmed:'All',Received:'Rel',Delayed:'Out',Scheduled:'Part',Rejected:'Out',Active:'In',Inactive:'Out',Open:'Pen',Resolved:'Rel','In Stock':'In','Low Stock':'Low','Out of Stock':'Out'};
const pill=s=>`<span class="pill ${CLS[s]||'Pen'}">${esc(s)}</span>`;

const D={
 suppliers:[
  {id:'SUP-001',name:'ABC Textile Co.',item:'Fabrics',contact:'0917 000 0001',status:'Active'},
  {id:'SUP-002',name:'Fabric Plus Inc.',item:'Fabrics, trims',contact:'0917 000 0002',status:'Active'},
  {id:'SUP-003',name:'PrintWorks Co.',item:'Printing materials',contact:'0917 000 0003',status:'Active'}],
 reqs:[
  {id:'REQ-001',item:'Fabric Samples',from:'Marketing',qty:5,status:'Approved'},
  {id:'REQ-002',item:'Printing Materials',from:'Marketing',qty:10,status:'Pending'},
  {id:'REQ-004',item:'Packaging Supplies',from:'Logistics',qty:50,status:'Approved'}],
 prs:[
  {id:'PR-001',item:'Fabric Materials',qty:20,supplier:'ABC Textile Co.',cost:30000,status:'Pending'},
  {id:'PR-002',item:'Packaging Supplies',qty:50,supplier:'Fabric Plus Inc.',cost:12500,status:'Approved'},
  {id:'PR-003',item:'Printing Materials',qty:15,supplier:'PrintWorks Co.',cost:9000,status:'Ordered'}],
 pos:[
  {id:'PO-2025-045',pr:'PR-003',supplier:'PrintWorks Co.',item:'Printing Materials',qty:15,total:9000,date:'2025-04-24',status:'Confirmed'}],
 inv:[
  {id:'INV-001',item:'Cotton Fabric',unit:'meters',stock:120,min:50},
  {id:'INV-002',item:'Packaging Materials',unit:'pieces',stock:30,min:40},
  {id:'INV-003',item:'Printing Materials',unit:'pieces',stock:5,min:10},
  {id:'INV-004',item:'Zippers',unit:'pieces',stock:0,min:30}],
 dels:[
  {id:'DEL-2025-001',po:'PO-2025-045',supplier:'PrintWorks Co.',date:'Apr 28, 2025',status:'Scheduled'},
  {id:'DEL-2025-002',po:'PO-2025-046',supplier:'ABC Textile Co.',date:'Apr 29, 2025',status:'Delayed'}],
 disc:[
  {id:'DSC-001',del:'DEL-2025-003',issue:'Damaged items (3 rolls)',supplier:'Fabric Plus Inc.',status:'Open'}]
};
const stockStatus=i=>i.stock===0?'Out of Stock':i.stock<i.min?'Low Stock':'In Stock';
const nextId=(p,a)=>p+'-'+String(a.length+1).padStart(3,'0');

const VIEWS=[['dashboard','▦','Dashboard'],['requisition','▤','Requisition'],['inventory','▣','Inventory'],['purchasing','▥','Purchasing'],['delivery','▧','Delivery']];
let view='dashboard',tab='Purchase Requests',q='';

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(html){$('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="card">${html}</div></div>`}
function closeM(){$('#layer').innerHTML=''}
function go(v,t){view=v;if(t)tab=t;q='';render()}

function table(cols,rows){return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${cols.length}" class="mut">Nothing here yet.</td></tr>`}</tbody></table></div>`}
const has=(o)=>!q||JSON.stringify(o).toLowerCase().includes(q.toLowerCase());
const search=ph=>`<input placeholder="${ph}" value="${esc(q)}" oninput="q=this.value;render(true)" aria-label="Search">`;

function dashboard(){
 const pend=D.prs.filter(p=>p.status==='Pending').length,act=D.pos.length+D.prs.filter(p=>p.status==='Ordered').length-D.pos.length;
 return `<h1>Welcome to Procurement!</h1><p class="sub">Purchasing and supplier overview</p>
 <div class="grid g4">
  <div class="card"><div class="mut">Purchase Requests</div><div class="big">${D.prs.length}</div><div class="mut">Total requests</div></div>
  <div class="card"><div class="mut">Pending Approvals</div><div class="big">${pend}</div><div class="mut">Awaiting Admin</div></div>
  <div class="card"><div class="mut">Active Purchase Orders</div><div class="big">${D.pos.length}</div><div class="mut">Currently processing</div></div>
  <div class="card"><div class="mut">Pending Deliveries</div><div class="big">${D.dels.length}</div><div class="mut">Awaiting arrival</div></div>
 </div>
 <div class="grid g2">
  <div class="card"><h2>Quick Actions</h2>
   <div class="row"><span><b>Create Purchase Request</b><br><span class="mut">Prepare a new purchase request</span></span><button class="pri sm" onclick="newPR()">Create</button></div>
   <div class="row"><span><b>Manage Suppliers</b><br><span class="mut">View and update supplier records</span></span><button class="sm" onclick="go('purchasing','Suppliers')">Open</button></div>
   <div class="row"><span><b>Create Purchase Order</b><br><span class="mut">From an approved purchase request</span></span><button class="sm" onclick="go('purchasing','Purchase Orders')">Open</button></div></div>
  <div class="card"><h2>Recent Purchase Requests</h2>
   ${D.prs.map(p=>`<div class="row"><span><b>${esc(p.item)}</b><br><span class="mut">${p.id} · ${p.qty} units</span></span>${pill(p.status)}</div>`).join('')}</div>
 </div>
 <div class="card"><h2>Supplier and Delivery Updates</h2>
  <div class="row"><span>${D.dels.length} deliveries are on the way or delayed.</span><button class="sm" onclick="go('delivery')">View</button></div>
  <div class="row"><span>${D.disc.filter(d=>d.status==='Open').length} discrepancy awaiting supplier response.</span><button class="sm" onclick="go('delivery','Discrepancies')">View</button></div></div>`}

function requisition(){
 const rows=D.reqs.filter(has).map(r=>`<tr><td>${r.id}</td><td>${esc(r.item)}</td><td>${r.from}</td><td>${r.qty}</td><td>${pill(r.status)}</td><td class="r">${r.status==='Approved'?`<button class="sm pri" onclick="newPR('${r.id}')">Make purchase request</button>`:''}</td></tr>`);
 return `<h1>Requisition</h1><p class="sub">Approved requisitions that need purchasing. Procurement acts as Purchasing Handler.</p>
 <div class="card"><div class="tools">${search('Search requisitions')}</div>${table(['ID','Item','Requested by','Qty','Status',''],rows)}</div>`}

function inventory(){
 const rows=D.inv.filter(has).map(i=>{const s=stockStatus(i);return `<tr><td>${i.id}</td><td>${esc(i.item)}</td><td>${i.stock} ${i.unit}</td><td>${i.min}</td><td>${pill(s)}</td><td class="r">${s!=='In Stock'?`<button class="sm" onclick="newPR('',${i.id.length?`'${esc(i.item)}'`:"''"})">Request restock</button>`:''}</td></tr>`});
 return `<h1>Inventory</h1><p class="sub">View-only stock levels. Procurement acts as Purchasing Coordinator.</p>
 <div class="card"><div class="tools">${search('Search products')}</div>${table(['ID','Product','In stock','Minimum','Status',''],rows)}</div>`}

function purchasing(){
 const T=['Purchase Requests','Purchase Orders','Suppliers'];let body='';
 if(tab==='Purchase Requests')body=`<div class="tools">${search('Search purchase requests')}<button class="pri" onclick="newPR()">New purchase request</button></div>`+table(['ID','Item','Qty','Supplier','Est. cost','Status',''],D.prs.filter(has).map(p=>`<tr><td>${p.id}</td><td>${esc(p.item)}</td><td>${p.qty}</td><td>${esc(p.supplier)}</td><td>${peso(p.cost)}</td><td>${pill(p.status)}</td><td class="r">${p.status==='Approved'?`<button class="sm pri" onclick="makePO('${p.id}')">Create PO</button>`:p.status==='Pending'?`<button class="sm" onclick="approve('${p.id}')">Mark approved (demo)</button>`:''}</td></tr>`));
 if(tab==='Purchase Orders')body=`<div class="tools">${search('Search purchase orders')}</div>`+table(['PO number','Supplier','Item','Qty','Total','Date','Status',''],D.pos.filter(has).map(o=>`<tr><td>${o.id}</td><td>${esc(o.supplier)}</td><td>${esc(o.item)}</td><td>${o.qty}</td><td>${peso(o.total)}</td><td>${o.date}</td><td>${pill(o.status)}</td><td class="r"><button class="sm" onclick="receipt('${o.id}')">Receipt</button></td></tr>`));
 if(tab==='Suppliers')body=`<div class="tools">${search('Search suppliers')}<button class="pri" onclick="newSup()">Add supplier</button></div>`+table(['ID','Supplier','Supplies','Contact','Status'],D.suppliers.filter(has).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.item)}</td><td>${esc(s.contact)}</td><td>${pill(s.status)}</td></tr>`));
 return `<h1>Purchasing</h1><p class="sub">Create requests, place orders, and manage suppliers.</p><div class="tabs">${T.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';q='';render()">${t}</button>`).join('')}</div><div class="card">${body}</div>`}

function delivery(){
 const T=['Incoming Deliveries','Discrepancies'];if(!T.includes(tab))tab=T[0];
 const body=tab===T[0]?table(['Delivery ID','PO number','Supplier','Expected','Status'],D.dels.map(d=>`<tr><td>${d.id}</td><td>${d.po}</td><td>${esc(d.supplier)}</td><td>${d.date}</td><td>${pill(d.status)}</td></tr>`))
 :table(['ID','Delivery','Issue','Supplier','Status',''],D.disc.map(d=>`<tr><td>${d.id}</td><td>${d.del}</td><td>${esc(d.issue)}</td><td>${esc(d.supplier)}</td><td>${pill(d.status)}</td><td class="r">${d.status==='Open'?`<button class="sm" onclick="resolveD('${d.id}')">Mark supplier resolved</button>`:''}</td></tr>`));
 return `<h1>Delivery</h1><p class="sub">Follow up suppliers on incoming deliveries and discrepancies. Procurement acts as Supplier Coordinator.</p><div class="tabs">${T.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><div class="card">${body}</div>`}

function newPR(reqId,item){
 const r=D.reqs.find(x=>x.id===reqId);
 modal(`<h2>New purchase request</h2><label for="f1">Item</label><input id="f1" value="${esc(r?r.item:item||'')}"><label for="f2">Quantity</label><input id="f2" type="number" min="1" value="${r?r.qty:1}"><label for="f3">Supplier</label><select id="f3">${D.suppliers.filter(s=>s.status==='Active').map(s=>`<option>${esc(s.name)}</option>`).join('')}</select><label for="f4">Estimated cost (₱)</label><input id="f4" type="number" min="0" value="0"><div class="tools" style="margin-top:16px;justify-content:flex-end"><button onclick="closeM()">Cancel</button><button class="pri" onclick="savePR()">Save request</button></div>`)}
function savePR(){const item=$('#f1').value.trim(),qty=+$('#f2').value;if(!item||qty<1){toast('Enter an item and a quantity of at least 1');return}
 D.prs.unshift({id:nextId('PR',D.prs),item,qty,supplier:$('#f3').value,cost:+$('#f4').value||0,status:'Pending'});closeM();go('purchasing','Purchase Requests');toast('Purchase request saved')}
function approve(id){D.prs.find(p=>p.id===id).status='Approved';render();toast('Marked approved. Real approval is done by Admin.')}
function makePO(id){const p=D.prs.find(x=>x.id===id);p.status='Ordered';
 D.pos.unshift({id:'PO-2026-'+String(D.pos.length+1).padStart(3,'0'),pr:id,supplier:p.supplier,item:p.item,qty:p.qty,total:p.cost,date:new Date().toISOString().slice(0,10),status:'Sent'});go('purchasing','Purchase Orders');toast('Purchase order created')}
function receipt(id){const o=D.pos.find(x=>x.id===id);
 modal(`<h2>Purchase order receipt</h2><div class="rc"><div class="row"><span>PO number</span><b>${o.id}</b></div><div class="row"><span>Date</span><span>${o.date}</span></div><div class="row"><span>Supplier</span><span>${esc(o.supplier)}</span></div><div class="row"><span>Item</span><span>${esc(o.item)}</span></div><div class="row"><span>Quantity</span><span>${o.qty}</span></div><div class="row"><span>Total</span><b>${peso(o.total)}</b></div></div><div class="tools noprint" style="margin-top:16px;justify-content:flex-end"><button onclick="closeM()">Close</button><button class="pri" onclick="window.print()">Print receipt</button></div>`)}
function newSup(){modal(`<h2>Add supplier</h2><label for="s1">Name</label><input id="s1"><label for="s2">Supplies</label><input id="s2"><label for="s3">Contact</label><input id="s3"><div class="tools" style="margin-top:16px;justify-content:flex-end"><button onclick="closeM()">Cancel</button><button class="pri" onclick="saveSup()">Save supplier</button></div>`)}
function saveSup(){const name=$('#s1').value.trim();if(!name){toast('Enter the supplier name');return}
 D.suppliers.push({id:nextId('SUP',D.suppliers),name,item:$('#s2').value,contact:$('#s3').value,status:'Active'});closeM();render();toast('Supplier saved')}
function resolveD(id){D.disc.find(d=>d.id===id).status='Resolved';render();toast('Discrepancy marked resolved')}

function render(keep){
 $('#nav').innerHTML=VIEWS.map(([k,i,l])=>`<a class="${k===view?'on':''}" tabindex="0" onclick="go('${k}')" onkeydown="if(event.key==='Enter')go('${k}')">${l}</a>`).join('')+`<a tabindex="0" onclick="toast('Logout is a demo for now')">Logout</a>`;
 const y=window.scrollY;$('#main').innerHTML=({dashboard,requisition,inventory,purchasing,delivery})[view]();
 if(keep){const el=document.querySelector('main input');if(el){el.focus();el.setSelectionRange(q.length,q.length)}window.scrollTo(0,y)}
}
render();
</script>
</body></html>
